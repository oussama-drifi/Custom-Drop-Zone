<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop Zone</title>
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="page">
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">
            <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
        </button>
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Upload Files</h2>
                <p class="card-description">Drag & drop files here, or click to browse</p>
            </div>

            <div class="dropzone" id="dropzone">
                <input type="file" id="fileInput" multiple accept="image/png,image/jpeg,image/webp,image/avif" hidden>
                <div class="dropzone-inner">
                    <div class="dropzone-icon">
                        <i class="bi bi-cloud-arrow-up"></i>
                    </div>
                    <p class="dropzone-label">Drop files here or <span class="browse-link">browse</span></p>
                    <p class="dropzone-hint">PNG, JPG, JPEG, WEBP, AVIF &mdash; max 10 MB each</p>
                </div>
                <div class="dropzone-overlay">
                    <i class="bi bi-cloud-arrow-down"></i>
                    <p>Release to upload</p>
                </div>
            </div>

            <div class="file-list" id="fileList"></div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
